name: Test and Deploy

# Tests run on every push and every pull request. Deployment only happens on main, and
# only after the tests pass.
#
# This used to be a deploy-only workflow: a push to main went straight to the VPS and ran
# `migrate --force` against production without the suite ever running. Since the script is
# `set -e` and starts with `php artisan down`, anything that failed on the way left the site
# in maintenance mode.
on:
  push:
    branches: [main]
  pull_request:

# A second push while a deploy is in flight would have two SSH sessions running
# git reset --hard and migrations against the same box.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.3 to match the php8.3-fpm the deploy reloads. Testing a version other than
          # the one production runs is testing something else.
          php-version: '8.3'
          # intl is required by filament/support; without it composer install refuses.
          extensions: mbstring, xml, curl, intl, pdo_sqlite, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # The suite renders Blade views, which need a built manifest. Without this every
      # view test fails on ViteManifestNotFoundException.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml pins the connection to in-memory sqlite, so no database service is
      # needed here.
      - name: Run tests
        run: php artisan test

      - name: Check formatting
        run: ./vendor/bin/pint --test
        continue-on-error: true

      # The EA cannot be compiled here - MetaEditor is Windows-only - so these catch the
      # two fault classes a text scan finds reliably. See scripts/check_mql5.py.
      - name: Check MQL5 sources
        run: python3 scripts/check_mql5.py mql5/Experts/GoldDigger/GoldDiggerBridge.mq5 mql5/Include/GoldDigger/GDExecutor.mqh

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/gold-digger

            echo "Starting deployment..."
            php artisan down --retry=60 || true

            git config --global --add safe.directory /var/www/gold-digger
            git fetch origin main
            git reset --hard origin/main

            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --no-interaction

            npm ci
            npm run build

            # Taken before migrations, not after. Several migrations alter existing
            # columns, and a half-applied migration is not something down() can undo.
            php artisan db:backup --keep=7

            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link --force || true

            chown -R www-data:www-data /var/www/gold-digger

            # Derived, not hardcoded. This said php8.3-fpm while scripts/server-setup.sh
            # provisions 8.2 and DEPLOYMENT.md documents 8.2 - so one of them was wrong
            # about the server, and under `set -e` reloading a unit that does not exist
            # aborts the deploy with the site still in maintenance mode.
            PHP_FPM="php$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')-fpm"
            systemctl reload "$PHP_FPM" || systemctl reload php-fpm

            php artisan up
            echo "Deployment completed at $(date)"

      # `set -e` plus `php artisan down` at the top means any failure above leaves the site
      # in maintenance mode. Bringing it back up is better than a silent outage: the code is
      # whatever the failing step left behind, but the previous release is still serving in
      # every case except a failure between reset and cache warming.
      - name: Bring the site back up if the deploy failed
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/gold-digger
            php artisan up || true
            echo "Deployment failed; maintenance mode lifted. Check the log above."
